services:

  # =========================
  # Codeforces Warehouse DB
  # =========================
  postgres:
    image: postgres:16
    container_name: codeforces-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeforces_dw
      POSTGRES_USER: codeforces
      POSTGRES_PASSWORD: codeforces_dev_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeforces -d codeforces_dw"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================
  # Airflow Metadata DB
  # =========================
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_dev_password
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================
  # Airflow API Server
  # =========================
  airflow-apiserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: codeforces-airflow-apiserver
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_dev_password@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "codeforces-airflow-dev-jwt-secret-change-this"
      AIRFLOW__API__SECRET_KEY: "codeforces-airflow-dev-api-secret-change-this"
      DBT_PROFILES_DIR: /opt/airflow/project/dbt/codeforces_warehouse
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
    ports:
      - "8082:8080"
    command: api-server


  # =========================
  # Airflow Scheduler
  # =========================
  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: codeforces-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_dev_password@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "codeforces-airflow-dev-jwt-secret-change-this"
      AIRFLOW__API__SECRET_KEY: "codeforces-airflow-dev-api-secret-change-this"
      DBT_PROFILES_DIR: /opt/airflow/project/dbt/codeforces_warehouse
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
    command: scheduler


  # =========================
  # Airflow DAG Processor
  # =========================
  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: codeforces-airflow-dag-processor
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_dev_password@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "codeforces-airflow-dev-jwt-secret-change-this"
      AIRFLOW__API__SECRET_KEY: "codeforces-airflow-dev-api-secret-change-this"
      DBT_PROFILES_DIR: /opt/airflow/project/dbt/codeforces_warehouse
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
    command: dag-processor


  # =========================
  # Airflow Triggerer
  # =========================
  airflow-triggerer:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: codeforces-airflow-triggerer
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_dev_password@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "codeforces-airflow-dev-jwt-secret-change-this"
      AIRFLOW__API__SECRET_KEY: "codeforces-airflow-dev-api-secret-change-this"
      DBT_PROFILES_DIR: /opt/airflow/project/dbt/codeforces_warehouse
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
    command: triggerer


volumes:
  postgres_data:
  airflow_postgres_data: