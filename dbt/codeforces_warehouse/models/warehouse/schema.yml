version: 2

models:
  - name: dim_problem
    description: "Dimension containing Codeforces problem metadata."

    columns:
      - name: problem_key
        description: "Stable deterministic key derived from the Codeforces problem natural key."
        tests:
          - not_null
          - unique

      - name: problem_natural_key
        description: "Natural identifier formed from contest_id and problem_index."
        tests:
          - not_null
          - unique

      - name: contest_id
        tests:
          - not_null

      - name: problem_index
        tests:
          - not_null

      - name: problem_name
        tests:
          - not_null


  - name: fact_problem_statistics
    description: "Fact table containing Codeforces problem solve statistics."

    columns:
      - name: problem_key
        description: "Stable key referencing dim_problem."
        tests:
          - not_null

      - name: problem_natural_key
        description: "Natural identifier for the Codeforces problem."
        tests:
          - not_null
          - unique

      - name: contest_id
        tests:
          - not_null

      - name: problem_index
        tests:
          - not_null

      - name: solved_count
        tests:
          - not_null